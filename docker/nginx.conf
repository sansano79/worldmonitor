worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  # Generated by the entrypoint. This file is empty of real-IP directives
  # unless the operator explicitly configures trusted reverse-proxy CIDRs.
  include       /tmp/nginx-realip.conf;
  default_type  application/octet-stream;
  limit_req_zone $binary_remote_addr zone=osm_tiles_per_ip:10m rate=20r/s;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Serve pre-compressed assets (gzip .gz — built by vite brotliPrecompressPlugin)
  # brotli_static requires ngx_brotli module — not in Alpine nginx, use gzip fallback
  gzip_static on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain application/xml text/xml image/svg+xml;

  # Temp dirs writable by non-root
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  # Cache only tiles requested for the current interactive viewport. Honour
  # upstream cache headers; use seven days only when the upstream omits them.
  proxy_cache_path /tmp/nginx-proxy/osm-cache levels=1:2 keys_zone=osm_tiles:10m
                   max_size=512m inactive=30d use_temp_path=off;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    # The Vite build renames the SPA entry index.html -> dashboard.html
    # (dashboardHtmlOutputPlugin, non-desktop builds), matching the Vercel
    # rewrite of the catch-all route to /dashboard.html. Keep nginx in sync.
    index dashboard.html index.html;

    # OSM standard raster tiles are requested only by the interactive Cesium
    # viewport. Keep the upstream fixed, preserve the browser Referer, and
    # identify the application because browsers cannot set User-Agent.
    location ~ "^/tiles/osm/(?<osm_z>[0-9]|1[0-9])/(?<osm_x>[0-9]{1,7})/(?<osm_y>[0-9]{1,7})\.png$" {
      limit_except GET { deny all; }
      limit_req zone=osm_tiles_per_ip burst=40 nodelay;
      limit_req_status 429;
      rewrite "^/tiles/osm/([0-9]|1[0-9])/([0-9]{1,7})/([0-9]{1,7})\.png$" /$1/$2/$3.png? break;
      proxy_pass https://tile.openstreetmap.org;
      proxy_ssl_server_name on;
      proxy_set_header Host tile.openstreetmap.org;
      proxy_set_header User-Agent "WorldMonitor CSM";
      proxy_set_header Referer $http_referer;
      # A browser hard refresh must not force a cache-bypass upstream.
      proxy_set_header Cache-Control "";
      proxy_set_header Pragma "";
      proxy_cache osm_tiles;
      proxy_cache_key $uri;
      proxy_cache_lock on;
      proxy_cache_revalidate on;
      proxy_cache_valid 200 7d;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      access_log off;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets — immutable cache
    location /assets/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location /map-styles/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location /data/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location /textures/ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Public embed entry: cross-origin embeddable, but locked down separately
    # from the dashboard diagnostic Permissions-Policy.
    location = /embed {
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header Cache-Control "private, no-cache, must-revalidate";
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), autoplay=(), bluetooth=(), display-capture=(), encrypted-media=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), midi=(), payment=(), picture-in-picture=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=(), tools=()" always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss: blob: data:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self' data: https:; media-src 'self' data: blob: https:; frame-src 'none'; frame-ancestors *; base-uri 'self'; object-src 'none'; form-action 'none'" always;
      try_files /embed.html =404;
    }

    location = /embed.html {
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header Cache-Control "private, no-cache, must-revalidate";
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), autoplay=(), bluetooth=(), display-capture=(), encrypted-media=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), midi=(), payment=(), picture-in-picture=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=(), tools=()" always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss: blob: data:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self' data: https:; media-src 'self' data: blob: https:; frame-src 'none'; frame-ancestors *; base-uri 'self'; object-src 'none'; form-action 'none'" always;
      try_files /embed.html =404;
    }

    location = /embed.js {
      add_header X-Content-Type-Options "nosniff" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Cache-Control "public, max-age=3600";
      try_files /embed.js =404;
    }

    # RSS responses are untrusted publisher content. Keep the browser from
    # treating a proxied HTML/SVG body as a same-origin document, even if the
    # sidecar is reached through a Docker ingress error or fallback path.
    location = /api/rss-proxy {
      add_header Origin-Agent-Cluster "?1" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "sandbox; default-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
      proxy_pass http://127.0.0.1:${LOCAL_API_PORT};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin http://localhost;
      proxy_set_header X-WorldMonitor-Local-Token "${LOCAL_API_TOKEN}";
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Native management is never exposed through the public Docker ingress.
    location ^~ /api/local- {
      add_header Origin-Agent-Cluster "?1" always;
      return 403;
    }

    # API proxy → Node.js local-api-server
    location /api/ {
      add_header Origin-Agent-Cluster "?1" always;
      proxy_pass http://127.0.0.1:${LOCAL_API_PORT};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Overwrite any client-supplied value. Docker country-brief LLM quota
      # keys on this header. When trusted proxies are configured, nginx's
      # real-IP module has already replaced $remote_addr with the client IP.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Pass Origin as localhost so api key checks pass for browser-origin requests
      proxy_set_header Origin http://localhost;
      # Docker/self-hosted browsers do not know the internal sidecar token.
      # Keep it in a dedicated transport header so a caller's Authorization
      # header (OAuth bearer) reaches the route handler unchanged.
      proxy_set_header X-WorldMonitor-Local-Token "${LOCAL_API_TOKEN}";
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # SPA fallback — all other routes serve dashboard.html (the renamed entry)
    location / {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Origin-Agent-Cluster "?1" always;
      add_header X-XSS-Protection "1; mode=block" always;
      # Dashboard CSP — keep in sync with docker/nginx-security-headers.conf and
      # vercel.json. The frontend-only image (docker/Dockerfile) applies this via
      # `include security_headers.conf`; this sidecar image inlines headers
      # per-location, so the SPA fallback must carry the dashboard CSP explicitly,
      # or the containerized dashboard runs CSP-less while /embed stays locked down.
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss: blob: data:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'strict-dynamic' 'nonce-wm-static-bootstrap' 'sha256-5Z9IhMFGUf29PVDaWoiTpwEg7J7Q4r4F49rLS77PJm0=' 'sha256-Z5TaQuwFMHlxoFSQYuTWfxuPE5RUOpVsZOttUGCcRNE=' 'sha256-Jgh3W4Qj3HWZPVSti0C073yuiaz611LO8OZRUCsN0x8=' 'sha256-EXBrp/yOlluawv4VDhli8iSRVcXnwQKDrGr4WtUcq/Y=' 'sha256-llBxZlyh3eu6gbNvZXaeD9oZE2jgTvnh72FEO/GDErQ=' 'sha256-sMkhxXs3qUW2IR01a4d3tL1e2XQV0XUwxXAeL31nDjM=' 'wasm-unsafe-eval'; worker-src 'self' blob:; font-src 'self' data:; media-src 'self' data: blob: https:; frame-src 'self' https://www.worldmonitor.app https://worldmonitor.app https://tech.worldmonitor.app https://finance.worldmonitor.app https://commodity.worldmonitor.app https://happy.worldmonitor.app https://energy.worldmonitor.app https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://webcams.windy.com https://challenges.cloudflare.com https://*.clerk.accounts.dev https://clerk.worldmonitor.app https://vercel.live https://*.dodopayments.com https://checkout.dodopayments.com https://test.checkout.dodopayments.com https://*.hs.dodopayments.com https://*.custom.hs.dodopayments.com https://pay.google.com https://hooks.stripe.com https://js.stripe.com; frame-ancestors 'self' https://www.worldmonitor.app https://tech.worldmonitor.app https://finance.worldmonitor.app https://commodity.worldmonitor.app https://happy.worldmonitor.app https://energy.worldmonitor.app https://worldmonitor.app; base-uri 'self'; object-src 'none'; form-action 'self' https://api.worldmonitor.app" always; # // pragma: allowlist secret
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      # Allow nested YouTube iframes to call requestStorageAccess().
      add_header Permissions-Policy "storage-access=(self \"https://www.youtube.com\" \"https://youtube.com\"), tools=(self)";
      # Generated corpus directories (e.g. /compare/, /countries/) contain only
      # index.html; without an explicit index lookup the $uri/ match would 403.
      try_files $uri $uri/ $uri/index.html /dashboard.html;
    }
  }
}
